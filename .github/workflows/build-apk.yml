
name: Build SUNDRA EDITS APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          unzip -o SUNDRA_EDITS_Android_Project.zip -d extracted

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
        working-directory: extracted/SUNDRA_EDITS_Android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUNDRA-EDITS-debug-apk
          path: extracted/SUNDRA_EDITS_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
